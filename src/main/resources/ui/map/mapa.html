<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Mapa de Movilidad Digital</title>
    <!-- Hoja de estilo local de Leaflet -->
        <link rel="stylesheet" href="./leaflet/leaflet.css"/>
    <style>
        html,
        body,
        #mapa {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
    <script>
        window.L_DISABLE_3D = true;
    </script>
    <script src="./leaflet/leaflet.js"></script>
</head>

<body>
    <div id="mapa"></div>
    <!-- Librería local de Leaflet -->


    <script>
        // 1. Variables globales
        var mapa = null;
        var capaRutas = null;
        var capaSeleccion = null;
        var modoSeleccion = null;
        var marcadorOrigen = null;
        var marcadorDestino = null;
        try {
			//cambiar esta lineas setView([-43.2489, -65.3054], 12) para trelwe y setView([-42.785, -65.07], 11) para madryn
            mapa = L.map("mapa").setView([-43.2489, -65.3054], 12); 
            L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
                maxZoom: 19,
                attribution: "© OpenStreetMap contributors",
            }).addTo(mapa);
            capaRutas = L.layerGroup().addTo(mapa);
            capaSeleccion = L.layerGroup().addTo(mapa);
        } catch (error) {
            alert("Error en Leaflet: " + error.message);
        }
        // 2. Captura de clics hacia Java
        if (mapa) {
            mapa.on("click", function (e) {
                if (modoSeleccion && window.javaBridge) {
                    window.javaBridge.seleccionarPunto(
                        modoSeleccion,
                        e.latlng.lat,
                        e.latlng.lng,
                    );
                }
            });
        }
        // 3. Funciones globales expuestas para Java
        window.activarSeleccion = function (tipo) {
            modoSeleccion = tipo;
        };
        window.cancelarSeleccion = function () {
            modoSeleccion = null;
        };
        window.mostrarMarcadorSeleccion = function (tipo, coords) {
            if (!capaSeleccion) return;
            if (tipo === "origen") {
                if (marcadorOrigen) capaSeleccion.removeLayer(marcadorOrigen);
                marcadorOrigen = L.circleMarker(coords, {
                    color: "blue",
                    radius: 8,
                }).addTo(capaSeleccion);
            } else if (tipo === "destino") {
                if (marcadorDestino) capaSeleccion.removeLayer(marcadorDestino);
                marcadorDestino = L.circleMarker(coords, {
                    color: "red",
                    radius: 8,
                }).addTo(capaSeleccion);
            }
        };
        window.mostrarRutas = function (datos) {
            if (!capaRutas) return;
            capaRutas.clearLayers();
            if (!datos) return;
            const puntosTotal = [];
            if (datos.acercamiento && datos.acercamiento.length > 0) {
                L.polyline(datos.acercamiento, { color: "#1763c0", weight: 5 }).addTo(
                    capaRutas,
                );
                puntosTotal.push(...datos.acercamiento);
            }
            if (datos.traslado && datos.traslado.length > 0) {
                L.polyline(datos.traslado, { color: "#149566", weight: 5 }).addTo(
                    capaRutas,
                );
                puntosTotal.push(...datos.traslado);
            }
            if (datos.conductor)
                L.circleMarker(datos.conductor, { color: "orange", radius: 6 }).addTo(
                    capaRutas,
                );
            if (datos.origen)
                L.circleMarker(datos.origen, { color: "blue", radius: 6 }).addTo(
                    capaRutas,
                );
            if (datos.destino)
                L.circleMarker(datos.destino, { color: "green", radius: 6 }).addTo(
                    capaRutas,
                );
            if (puntosTotal.length > 0 && mapa) mapa.fitBounds(puntosTotal);
        };
        window.limpiarSeleccion = function () {
            if (capaSeleccion) capaSeleccion.clearLayers();
            marcadorOrigen = null;
            marcadorDestino = null;
        };
        window.limpiarRutas = function () {
            if (capaRutas) capaRutas.clearLayers();
        };
        setTimeout(function () {
            if (mapa) mapa.invalidateSize();
        }, 500);
        // Recalcular si el usuario redimensiona la ventana
        window.addEventListener("resize", function () {
            if (mapa) mapa.invalidateSize();
        });

        window.limpiarMarcador = function (tipo) {
            if (!capaSeleccion) return;
            if (tipo === "origen" && marcadorOrigen) {
                capaSeleccion.removeLayer(marcadorOrigen);
                marcadorOrigen = null;
            } else if (tipo === "destino" && marcadorDestino) {
                capaSeleccion.removeLayer(marcadorDestino);
                marcadorDestino = null;
            }
        };
    </script>
</body>

</html>
