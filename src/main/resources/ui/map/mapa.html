<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Mapa de Movilidad Digital</title>
    <!-- Hoja de estilo local de Leaflet -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
            <style>
html, body {
 width: 100%;
 height: 100%;
 margin: 0;
 padding: 0;
 overflow: hidden;
}
#mapa {
 position: absolute;
 top: 0;
 bottom: 0;
 left: 0;
 right: 0;
}
    </style>
</head>

<body>
    <div id="mapa"></div>
    <!-- Librería local de Leaflet -->
    
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
    <script>
        try {
            const mapa = L.map("mapa").setView([-42.785, -65.07], 11);
            L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
                maxZoom: 19,
                attribution: "© OpenStreetMap contributors",
            }).addTo(mapa);
        } catch (error) {
            alert("Error en Leaflet: " + error.message);
        }
        // Capas para organizar marcadores y líneas de ruta
        const capaRutas = L.layerGroup().addTo(mapa);
        const capaSeleccion = L.layerGroup().addTo(mapa);
        let modoSeleccion = null;
        let marcadorOrigen = null;
        let marcadorDestino = null;
        // Captura de clics enviada a Java (window.javaBridge)
        mapa.on("click", function (e) {
            if (modoSeleccion && window.javaBridge) {
                window.javaBridge.seleccionarPunto(
                    modoSeleccion,
                    e.latlng.lat,
                    e.latlng.lng,
                );
            }
        });
        // --- FUNCIONES INVOCADAS DESDE VisualizadorRutasLeaflet.java ---
        window.activarSeleccion = function (tipo) {
            modoSeleccion = tipo;
        };
        window.cancelarSeleccion = function () {
            modoSeleccion = null;
        };
        window.mostrarMarcadorSeleccion = function (tipo, coords) {
            if (tipo === "origen") {
                if (marcadorOrigen) capaSeleccion.removeLayer(marcadorOrigen);
                marcadorOrigen = L.circleMarker(coords, {
                    color: "blue",
                    radius: 8,
                }).addTo(capaSeleccion);
            } else if (tipo === "destino") {
                if (marcadorDestino) capaSeleccion.removeLayer(marcadorDestino);
                marcadorDestino = L.circleMarker(coords, {
                    color: "red",
                    radius: 8,
                }).addTo(capaSeleccion);
            }
        };
        window.mostrarRutas = function (datos) {
            capaRutas.clearLayers();
            if (!datos) return;
            const puntosTotal = [];
            if (datos.acercamiento && datos.acercamiento.length > 0) {
                L.polyline(datos.acercamiento, { color: "#1763c0", weight: 5 }).addTo(
                    capaRutas,
                );
                puntosTotal.push(...datos.acercamiento);
            }
            if (datos.traslado && datos.traslado.length > 0) {
                L.polyline(datos.traslado, { color: "#149566", weight: 5 }).addTo(
                    capaRutas,
                );
                puntosTotal.push(...datos.traslado);
            }
            if (datos.conductor)
                L.circleMarker(datos.conductor, { color: "orange", radius: 6 }).addTo(
                    capaRutas,
                );
            if (datos.origen)
                L.circleMarker(datos.origen, { color: "blue", radius: 6 }).addTo(
                    capaRutas,
                );
            if (datos.destino)
                L.circleMarker(datos.destino, { color: "green", radius: 6 }).addTo(
                    capaRutas,
                );
            if (puntosTotal.length > 0) mapa.fitBounds(puntosTotal);
        };
        window.limpiarSeleccion = function () {
            capaSeleccion.clearLayers();
            marcadorOrigen = null;
            marcadorDestino = null;
        };
        window.limpiarRutas = function () {
            capaRutas.clearLayers();
        };
        window.refrescarTamano = function () {
            mapa.invalidateSize({ pan: false });
        };

        window.refrescarTamano = function() { if (mapa) { setTimeout(function() { mapa.invalidateSize(); }, 200); } };
    </script>
</body>

</html>
