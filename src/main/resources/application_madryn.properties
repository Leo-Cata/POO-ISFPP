# Configuracion principal de la aplicacion
app.name=Sistema de Movilidad Digital
app.version=1.1.0

# Selecciona UI (JAVAFX | CLI)
app.ui.type=JAVAFX

# Idioma de presentacion al iniciar
app.language=en
app.country=US


# Selecciona persistencia (TXT | BD)
origen.datos=BD

# Rutas de datos para persistencia en archivos secuenciales
#usuario=datos/usuarios.txt
#servicio=datos/servicios.txt
#vehiculo=datos/vehiculos.txt

# Ruta a archivos .txt sin motos
usuario=datos/pruebas/sin-motos/usuarios1.txt
servicio=datos/pruebas/sin-motos/servicios1.txt
vehiculo=datos/pruebas/sin-motos/vehiculos1.txt

# Archivo con driver, url, usuario y clave (solo si origen.datos = BD)
bd.config=jdbc.properties


# Configuracion geografica inicial
# Egido de Puerto Madryn
latitud2=-42.57303
longitud2=-64.78616
latitud1=-42.87689
longitud1=-65.20872

# Distancia maxima permitida para ajustar una ubicacion a una calle (metros)
ubicacion.tolerancia.ajuste.metros=50.0


# Motor de calculo de rutas
rutas.motor=GRAPHHOPPER

# Datos viales y directorio de cache
rutas.osm=mapas/puerto_madryn_ampliado.osm
rutas.cache=mapas/graphhopper-cache-madryn-ampliado

# Velocidad media comercial utilizada para estimar la duracion del viaje
viaje.velocidad.media.kmh=40.0


# Costo de cancelacion de un viaje aceptado
costo.cancelacion.aceptado=0.1