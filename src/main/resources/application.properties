# Configuración principal de la aplicación 
app.name=Sistema de Movilidad Digital
app.version=1.1.0

# Selección dinámica de UI (JAVAFX | CLI)
app.ui.type=JAVAFX

# Selección dinámica de Persistencia (TXT | BD)
origen.datos=TXT

# Rutas de datos para persistencia en archivos secuenciales
usuario=usuarios.txt
servicio=servicios.txt
vehiculo=vehiculos.txt

# archivo con driver, url, usuario y clave (solo si origen.datos = BD)
bd.config = jdbc.properties

#Egido de Puerto Madryn
latitud2=-42.57303
longitud2=-64.78616
latitud1=-42.87689
longitud1=-65.20872

# Idioma de presentación al iniciar (es/ES o en/US)
app.language=es
app.country=ES
# Distancia maxima permitida para ajustar una ubicacion a una calle (metros)
ubicacion.tolerancia.ajuste.metros=50.0
# Motor de c�lculo de rutas
rutas.motor=GRAPHHOPPER

# Datos viales y directorio de cach�
rutas.osm=mapas/puerto_madryn_ampliado.osm
rutas.cache=mapas/graphhopper-cache-madryn-ampliado