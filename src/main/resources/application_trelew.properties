# Configuracion principal de la aplicacion 
app.name=Sistema de Movilidad Digital
app.version=1.1.0

# Selecciona UI (JAVAFX | CLI)
app.ui.type=JAVAFX

# Selecciona persistencia (TXT | BD)
origen.datos=BD

# Rutas de datos para persistencia en archivos secuenciales
usuario=usuarios.txt
servicio=servicios.txt
vehiculo=vehiculos.txt

# archivo con driver, url, usuario y clave (solo si origen.datos = BD)
bd.config = jdbc.properties

#Ejido de Trelew: limites del extracto OSM trelew_ampliado.osm (openstreetmap.org)
latitud2=-43.2277
longitud2=-65.22978
latitud1=-43.2957
longitud1=-65.38118

# Idioma de presentacion al iniciar (es/ES o en/US)
app.language=en
app.country=US

# Distancia maxima permitida para ajustar una ubicacion a una calle (metros)
ubicacion.tolerancia.ajuste.metros=50.0
# Motor de calculo de rutas
rutas.motor=GRAPHHOPPER

# Datos viales y directorio de cache
rutas.osm=mapas/trelew_ampliado.osm
rutas.cache=mapas/graphhopper-cache-trelew
# Velocidad media comercial utilizada para estimar la duraci�n del viaje.
viaje.velocidad.media.kmh=40.0

#Costo de cancelacion de un viaje aceptado
costo.cancelacion.aceptado = 0.1

simulacion.duracion.segundos=120
simulacion.factor.aceleracion=60
simulacion.politica=CERCANIA
simulacion.espera.maxima.segundos=30
simulacion.intervalo.solicitudes.ms=3000
