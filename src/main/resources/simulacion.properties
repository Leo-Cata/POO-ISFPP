
# Configuracion de simulacion

# Duracion total de la simulacion en segundos reales
simulacion.duracion.segundos=120

# Factor de aceleracion de los recorridos
simulacion.factor.aceleracion=60

# Politica de asignacion: SORTEO, CERCANIA o ROTACION
simulacion.politica=CERCANIA

# Espera maxima para conseguir conductor, en segundos
simulacion.espera.maxima.segundos=30

# Intervalo entre solicitudes generadas, en milisegundos
simulacion.intervalo.solicitudes.ms=3000
